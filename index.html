<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بنك ومتجر سان أوري — San Ori Bank & Store</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #121826;
      --panel-2: #182032;
      --border: #253047;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #131d31 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      padding: 18px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand h1 {
      font-size: 1.35rem;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .brand p {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .wallet-box {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .balance-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      text-align: center;
    }

    .balance-card span {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .balance-card strong {
      font-size: 1.2rem;
      color: var(--accent-2);
    }

    .account-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    input, select, button {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 9px 12px;
      font-size: 0.9rem;
      outline: none;
    }

    input, select {
      background: var(--panel-2);
      color: var(--text);
    }

    button {
      background: var(--accent);
      color: #06101a;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-success {
      background: var(--accent-2);
      color: #052e16;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 16px;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #06101a;
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .panel h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .item-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .badge {
      display: inline-block;
      font-size: 0.74rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      margin-bottom: 6px;
    }

    .badge-daily {
      background: rgba(245, 158, 11, 0.16);
      color: var(--warn);
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .item-desc {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .item-price {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent-2);
      margin-top: 6px;
    }

    .cooldown-text {
      font-size: 0.78rem;
      color: var(--warn);
      min-height: 18px;
    }

    .list-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }

    .list-row {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.88rem;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 18px;
      right: 18px;
      max-width: 460px;
      margin: 0 auto;
      background: var(--panel-2);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 99;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>بنك ومتجر سان أوري — San Ori RP</h1>
        <p>نظام الرول بلاي والمعدات الخفيفة المسموحة (رصيد البداية: 1,000 نقطة)</p>
      </div>

      <div class="wallet-box">
        <div class="balance-card">
          <span>رصيد الكاش</span>
          <strong id="cashBalance">1,000</strong>
        </div>
        <div class="balance-card">
          <span>رصيد البنك</span>
          <strong id="bankBalance">0</strong>
        </div>
      </div>

      <div class="account-controls">
        <input id="accountInput" type="text" placeholder="اسم الحساب (مثال: Dr_BLACK)" />
        <button id="switchAccountBtn" type="button">دخول / إنشاء</button>
        <button id="resetAccountBtn" class="btn-secondary" type="button">إعادة ضبط الحساب</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="store" type="button">المتجر والمعدات</button>
      <button class="tab-btn" data-tab="bank" type="button">البنك والتحويلات</button>
      <button class="tab-btn" data-tab="inventory" type="button">الحقيبة والسجل</button>
    </div>

    <!-- قسم المتجر -->
    <section id="tab-store">
      <div class="panel">
        <h2>قائمة الأسلحة الخفيفة والمعدات المسموحة في سان أوري</h2>
        <div id="storeGrid" class="store-grid"></div>
      </div>
    </section>

    <!-- قسم البنك -->
    <section id="tab-bank" class="hidden">
      <div class="grid-2">
        <div class="panel">
          <h2>إيداع وسحب النقاط</h2>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <input id="bankAmountInput" type="number" min="1" placeholder="أدخل المبلغ" />
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button id="depositBtn" class="btn-success" type="button">إيداع في البنك</button>
              <button id="withdrawBtn" class="btn-secondary" type="button">سحب إلى الكاش</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>تحويل نقاط لحساب آخر</h2>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <input id="transferTargetInput" type="text" placeholder="اسم الحساب المستلم" />
            <input id="transferAmountInput" type="number" min="1" placeholder="قيمة التحويل" />
            <button id="transferBtn" type="button">إرسال التحويل</button>
          </div>
        </div>
      </div>
    </section>

    <!-- قسم الحقيبة والسجل -->
    <section id="tab-inventory" class="hidden">
      <div class="grid-2">
        <div class="panel">
          <h2>معداتي المشتراة</h2>
          <div id="inventoryList" class="list-box"></div>
        </div>

        <div class="panel">
          <h2>سجل العمليات الأخيرة</h2>
          <div id="historyList" class="list-box"></div>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = "san_ori_bank_system_v1";
    const INITIAL_CASH = 1000;
    const DAILY_MS = 24 * 60 * 60 * 1000;

    // القائمة المعتمدة من سان أوري (بدون قلاع أو دروع أو MP5 أو P90)
    const ITEMS = [
      { id: "knife", name: "سكين", category: "قتال عن قرب", price: 150, desc: "سلاح أبيض خفيف للاشتباك القريب في الشوارع." },
      { id: "battle_axe", name: "فأس المعركة", category: "قتال عن قرب", price: 250, desc: "فأس خفيف بضرر مباشر للمواجهات القريبة." },
      { id: "baton", name: "العصا", category: "قتال عن قرب", price: 600, desc: "عصا للسيطرة والاشتباك القريب مع تأثير دفع." },
      { id: "glock_17", name: "جلوك 17", category: "مسدس خفيف", price: 700, desc: "مسدس خفيف عملي وسريع الاستخدام في الرول بلاي." },
      { id: "m19", name: "M19", category: "مسدس خفيف", price: 800, desc: "مسدس خفيف بدقة وثبات جيدين." },
      { id: "deagle_44", name: "ديجل 44", category: "مسدس خفيف", price: 950, desc: "مسدس خفيف عالي الضرر للمواقف الحاسمة." },
      {
        id: "handcuffs",
        name: "كلبشات",
        category: "معدات الضبط",
        price: 1000,
        dailyLimit: true,
        desc: "مسموح بشرائها مرة واحدة فقط كل 24 ساعة."
      },
      { id: "mac_11", name: "MAC-11", category: "رشاش خفيف", price: 1100, desc: "سلاح رشاش خفيف سريع الطلقات." },
      { id: "axe", name: "الفأس", category: "قتال عن قرب", price: 1200, desc: "فأس قتال عن قرب بضرر مرتفع." },
      { id: "medical", name: "الطب", category: "علاج وصحة", price: 2000, desc: "حقيبة/علاج طبي لاستعادة الصحة في الرول بلاي." }
    ];

    function createFreshAccount(username) {
      return {
        username,
        cash: INITIAL_CASH,
        bank: 0,
        inventory: {},
        lastHandcuffPurchase: null,
        history: [
          {
            text: `تم إنشاء الحساب برصيد ابتدائي ${INITIAL_CASH.toLocaleString()} نقطة`,
            time: new Date().toLocaleTimeString("ar-EG")
          }
        ]
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const def = createFreshAccount("Dr_BLACK");
          return { activeUser: "Dr_BLACK", accounts: { Dr_BLACK: def } };
        }
        const parsed = JSON.parse(raw);
        if (!parsed.accounts || !parsed.activeUser || !parsed.accounts[parsed.activeUser]) {
          const def = createFreshAccount("Dr_BLACK");
          return { activeUser: "Dr_BLACK", accounts: { Dr_BLACK: def } };
        }
        return parsed;
      } catch {
        const def = createFreshAccount("Dr_BLACK");
        return { activeUser: "Dr_BLACK", accounts: { Dr_BLACK: def } };
      }
    }

    let state = loadState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getCurrentUser() {
      return state.accounts[state.activeUser];
    }

    function addLog(user, text) {
      user.history.unshift({
        text,
        time: new Date().toLocaleTimeString("ar-EG")
      });
      if (user.history.length > 40) user.history.pop();
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 2800);
    }

    function formatRemaining(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function getHandcuffCooldownRemaining(user) {
      if (!user.lastHandcuffPurchase) return 0;
      const elapsed = Date.now() - user.lastHandcuffPurchase;
      return Math.max(0, DAILY_MS - elapsed);
    }

    function buyItem(itemId) {
      const item = ITEMS.find((i) => i.id === itemId);
      const user = getCurrentUser();
      if (!item || !user) return;

      if (item.dailyLimit) {
        const rem = getHandcuffCooldownRemaining(user);
        if (rem > 0) {
          showToast(`الكلبشات متاحة مرة واحدة يومياً — المتبقي ${formatRemaining(rem)}`);
          return;
        }
      }

      if (user.cash < item.price) {
        showToast("رصيد الكاش غير كافٍ لشراء هذا العنصر");
        return;
      }

      user.cash -= item.price;
      user.inventory[item.name] = (user.inventory[item.name] || 0) + 1;
      if (item.dailyLimit) {
        user.lastHandcuffPurchase = Date.now();
      }
      addLog(user, `شراء ${item.name} مقابل ${item.price.toLocaleString()} نقطة`);
      saveState();
      renderAll();
      showToast(`تم شراء ${item.name} بنجاح`);
    }

    function renderStore() {
      const grid = document.getElementById("storeGrid");
      const user = getCurrentUser();
      const cuffRem = getHandcuffCooldownRemaining(user);

      grid.innerHTML = ITEMS.map((item) => {
        const isDailyLocked = item.dailyLimit && cuffRem > 0;
        const canAfford = user.cash >= item.price;
        const disabled = isDailyLocked || !canAfford;

        return `
          <div class="item-card">
            <div>
              <span class="badge ${item.dailyLimit ? "badge-daily" : ""}">${item.category}</span>
              <div class="item-title">${item.name}</div>
              <p class="item-desc">${item.desc}</p>
              <div class="item-price">${item.price.toLocaleString()} نقطة</div>
            </div>
            <div>
              <div class="cooldown-text">
                ${item.dailyLimit ? (cuffRem > 0 ? `متاح بعد: ${formatRemaining(cuffRem)}` : "متاح اليوم (مرة واحدة كل 24 ساعة)") : ""}
              </div>
              <button type="button" style="width:100%" ${disabled ? "disabled" : ""} onclick="buyItem('${item.id}')">
                ${isDailyLocked ? "تم الشراء اليوم" : "شراء"}
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderInventoryAndHistory() {
      const user = getCurrentUser();
      const invBox = document.getElementById("inventoryList");
      const histBox = document.getElementById("historyList");

      const invEntries = Object.entries(user.inventory).filter(([, count]) => count > 0);
      invBox.innerHTML = invEntries.length
        ? invEntries
            .map(
              ([name, count]) => `
              <div class="list-row">
                <strong>${name}</strong>
                <span>الكمية: ${count}</span>
              </div>
            `
            )
            .join("")
        : `<div class="list-row"><span>الحقيبة فارغة حالياً</span></div>`;

      histBox.innerHTML = user.history
        .map(
          (h) => `
          <div class="list-row">
            <span>${h.text}</span>
            <small style="color:var(--muted)">${h.time}</small>
          </div>
        `
        )
        .join("");
    }

    function renderAll() {
      const user = getCurrentUser();
      document.getElementById("accountInput").value = state.activeUser;
      document.getElementById("cashBalance").textContent = user.cash.toLocaleString();
      document.getElementById("bankBalance").textContent = user.bank.toLocaleString();
      renderStore();
      renderInventoryAndHistory();
    }

    document.getElementById("switchAccountBtn").addEventListener("click", () => {
      const name = document.getElementById("accountInput").value.trim();
      if (!name) return showToast("اكتب اسم الحساب أولاً");
      if (!state.accounts[name]) {
        state.accounts[name] = createFreshAccount(name);
        showToast(`تم إنشاء حساب جديد باسم ${name} برصيد 1,000 نقطة`);
      } else {
        showToast(`تم الدخول إلى حساب ${name}`);
      }
      state.activeUser = name;
      saveState();
      renderAll();
    });

    document.getElementById("resetAccountBtn").addEventListener("click", () => {
      const name = state.activeUser;
      state.accounts[name] = createFreshAccount(name);
      saveState();
      renderAll();
      showToast("تمت إعادة ضبط الحساب إلى 1,000 نقطة");
    });

    document.getElementById("depositBtn").addEventListener("click", () => {
      const amount = Number(document.getElementById("bankAmountInput").value);
      const user = getCurrentUser();
      if (!amount || amount <= 0) return showToast("أدخل مبلغاً صحيحاً");
      if (user.cash < amount) return showToast("رصيد الكاش لا يكفي للإيداع");
      user.cash -= amount;
      user.bank += amount;
      addLog(user, `إيداع ${amount.toLocaleString()} نقطة في البنك`);
      document.getElementById("bankAmountInput").value = "";
      saveState();
      renderAll();
      showToast("تم الإيداع بنجاح");
    });

    document.getElementById("withdrawBtn").addEventListener("click", () => {
      const amount = Number(document.getElementById("bankAmountInput").value);
      const user = getCurrentUser();
      if (!amount || amount <= 0) return showToast("أدخل مبلغاً صحيحاً");
      if (user.bank < amount) return showToast("رصيد البنك لا يكفي للسحب");
      user.bank -= amount;
      user.cash += amount;
      addLog(user, `سحب ${amount.toLocaleString()} نقطة إلى الكاش`);
      document.getElementById("bankAmountInput").value = "";
      saveState();
      renderAll();
      showToast("تم السحب بنجاح");
    });

    document.getElementById("transferBtn").addEventListener("click", () => {
      const targetName = document.getElementById("transferTargetInput").value.trim();
      const amount = Number(document.getElementById("transferAmountInput").value);
      const user = getCurrentUser();

      if (!targetName) return showToast("اكتب اسم الحساب المستلم");
      if (targetName === state.activeUser) return showToast("لا يمكنك التحويل لنفس الحساب");
      if (!amount || amount <= 0) return showToast("أدخل قيمة تحويل صحيحة");
      if (user.cash < amount) return showToast("رصيد الكاش غير كافٍ للتحويل");

      if (!state.accounts[targetName]) {
        state.accounts[targetName] = createFreshAccount(targetName);
      }
      const targetUser = state.accounts[targetName];

      user.cash -= amount;
      targetUser.cash += amount;
      addLog(user, `تحويل ${amount.toLocaleString()} نقطة إلى ${targetName}`);
      addLog(targetUser, `استلام ${amount.toLocaleString()} نقطة من ${state.activeUser}`);

      document.getElementById("transferTargetInput").value = "";
      document.getElementById("transferAmountInput").value = "";
      saveState();
      renderAll();
      showToast(`تم تحويل ${amount.toLocaleString()} نقطة إلى ${targetName}`);
    });

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const targetTab = btn.dataset.tab;
        ["store", "bank", "inventory"].forEach((t) => {
          document.getElementById(`tab-${t}`).classList.toggle("hidden", t !== targetTab);
        });
      });
    });

    // تحديث عدّاد الكلبشات كل ثانية إذا كان القسم مفتوحاً
    setInterval(() => {
      const user = getCurrentUser();
      if (user.lastHandcuffPurchase && !document.getElementById("tab-store").classList.contains("hidden")) {
        renderStore();
      }
    }, 1000);

    saveState();
    renderAll();
  </script>
</body>
</html>
